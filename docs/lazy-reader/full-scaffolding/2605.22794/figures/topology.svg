<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">MOSS host-side topology</title>
  <desc id="desc">Gateway container connects to a host daemon over HTTP and Unix socket. The daemon spawns a coding-agent CLI and ephemeral trial workers.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
  <rect x="25" y="25" width="1050" height="490" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="52" y="65" font-family="sans-serif" font-size="23" fill="#334155">Host machine</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#0f172a">
    <rect x="80" y="115" width="395" height="145" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="278" y="158" font-size="26" font-weight="700">moss-gateway container</text>
    <text x="278" y="195" font-size="20">agent + evolution service</text><text x="278" y="226" font-size="20">+ bind-mounted moss CLI</text>
    <rect x="625" y="95" width="390" height="185" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="820" y="137" font-size="26" font-weight="700">host-daemon</text>
    <text x="820" y="174" font-size="20">asyncio RPC server</text><text x="820" y="205" font-size="20">swap supervisor</text><text x="820" y="236" font-size="20">auto-scan engine</text>
    <rect x="260" y="360" width="320" height="105" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="420" y="402" font-size="25" font-weight="700">Coding-agent CLI</text><text x="420" y="435" font-size="19">spawned per stage</text>
    <rect x="680" y="360" width="320" height="105" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="840" y="402" font-size="25" font-weight="700">Trial workers × N</text><text x="840" y="435" font-size="19">ephemeral, per iteration</text>
  </g>
  <g stroke="#334155" stroke-width="4" fill="none" marker-start="url(#a)" marker-end="url(#a)"><path d="M475 150 C535 95 565 95 625 145"/><path d="M475 225 C535 285 565 285 625 230"/></g>
  <g font-family="sans-serif" font-size="17" fill="#334155" text-anchor="middle"><text x="550" y="106">HTTP (API + hooks)</text><text x="550" y="288">Unix socket (RPC)</text></g>
  <g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M745 280L545 360"/><path d="M880 280L855 360"/></g>
  <g font-family="sans-serif" font-size="17" fill="#334155"><text x="640" y="325">spawn</text><text x="875" y="326">spawn</text></g>
</svg>
