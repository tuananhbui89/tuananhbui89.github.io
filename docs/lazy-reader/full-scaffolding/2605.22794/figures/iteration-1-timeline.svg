<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">MOSS iteration-one timeline</title><desc id="desc">Locate, Plan, Implement, Build, Trial, Task-Evaluate, and Verdict execute in order; review stages are elided.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
  <g font-family="sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="600" y="45" font-size="28" font-weight="700">Iteration 1 (review gates elided)</text>
    <g font-size="20" font-weight="600">
      <rect x="35" y="95" width="190" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="130" y="143">① Locate</text>
      <rect x="265" y="95" width="190" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="360" y="143">② Plan</text>
      <rect x="495" y="95" width="190" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="590" y="143">④ Implement</text>
      <rect x="725" y="95" width="190" height="78" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="820" y="143">Build</text>
      <rect x="725" y="255" width="190" height="78" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/><text x="820" y="303">Trial</text>
      <rect x="465" y="255" width="220" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="575" y="303">⑥ Task-Evaluate</text>
      <rect x="205" y="255" width="220" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="315" y="303">⑦ Verdict</text>
    </g>
  </g>
  <g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M225 134L265 134"/><path d="M455 134L495 134"/><path d="M685 134L725 134"/><path d="M820 173L820 255"/><path d="M725 294L685 294"/><path d="M465 294L425 294"/></g>
