<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Four nested levels of MOSS evolution</title><desc id="desc">A baseline surrounds an iteration loop, a seven-stage pipeline, and internal review retry rounds.</desc>
  <g font-family="sans-serif" fill="#0f172a" text-anchor="middle">
    <rect x="55" y="35" width="990" height="550" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <text x="550" y="82" font-size="28" font-weight="700">Layer 0: pre-loop baseline</text>
    <rect x="95" y="112" width="910" height="430" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/>
    <text x="550" y="157" font-size="27" font-weight="700">Layer 1: iteration loop</text><text x="550" y="190" font-size="21">iter 1 → iter 2 → … → iter N</text>
    <rect x="140" y="220" width="820" height="275" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
    <text x="550" y="263" font-size="26" font-weight="700">Layer 2: seven-stage pipeline</text>
    <text x="550" y="305" font-size="20">① Locate → ② Plan → ③ Plan-Review → ④ Implement</text><text x="550" y="339" font-size="20">⑤ Code-Review → ⑥ Task-Evaluate → ⑦ Verdict</text>
    <rect x="205" y="375" width="690" height="85" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="4"/>
    <text x="550" y="410" font-size="23" font-weight="700">Layer 3: stage-internal retry round</text><text x="550" y="440" font-size="19">round 0 → round 1 → …</text>
  </g>
</svg>
