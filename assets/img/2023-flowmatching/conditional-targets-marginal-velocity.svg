<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
  <title id="title">Different targets, one learned velocity</title>
  <desc id="desc">Two straight conditional paths meet at the same time and location but have different velocities. With equally likely endpoints, their horizontal components cancel and their mean points upward. The model learns this mean from time and location alone.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#176fa0"/></marker>
    <marker id="orange-arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#b84c18"/></marker>
    <marker id="mean-arrow" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 15 8 L 1 15 Z" fill="#69368e"/></marker>
  </defs>
  <rect width="760" height="650" rx="20" fill="#fcfbf7"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#1e2935" text-anchor="middle">
    <text x="380" y="44" font-size="29" font-weight="700">Different targets, one learned velocity</text>
    <text x="380" y="82" font-size="22">Two equally likely endpoints · t = 1/2</text>
    <g aria-label="Data endpoint nodes">
      <rect x="166" y="162" width="28" height="28" rx="5" fill="#f7e4da" stroke="#b84c18" stroke-width="3"/>
      <rect x="566" y="162" width="28" height="28" rx="5" fill="#dfedf5" stroke="#176fa0" stroke-width="3"/>
      <text x="180" y="143" font-size="23" font-weight="600" fill="#9c3d11">data B</text>
      <text x="580" y="143" font-size="23" font-weight="600" fill="#145e87">data A</text>
    </g>
    <g aria-label="Shared current input">
      <circle cx="380" cy="326" r="16" fill="#1e2935"/>
      <text x="380" y="333" font-size="23" font-style="italic" fill="#ffffff">x</text>
      <text x="380" y="132" font-size="23" font-weight="700" fill="#69368e">mean velocity</text>
      <text x="380" y="160" font-size="23" font-style="italic" fill="#69368e">u<tspan baseline-shift="sub" font-size="16">t</tspan>(x)</text>
      <text x="159" y="280" font-size="22" fill="#9c3d11">target B</text>
      <text x="601" y="280" font-size="22" fill="#145e87">target A</text>
    </g>
    <g aria-label="Noise sample nodes">
      <circle cx="180" cy="476" r="14" fill="#dfedf5" stroke="#176fa0" stroke-width="3"/>
      <circle cx="580" cy="476" r="14" fill="#f7e4da" stroke="#b84c18" stroke-width="3"/>
      <text x="180" y="520" font-size="23" font-weight="600" fill="#145e87">noise A</text>
      <text x="580" y="520" font-size="23" font-weight="600" fill="#9c3d11">noise B</text>
    </g>
    <g aria-label="Explanatory notes">
      <text x="380" y="564" font-size="20" fill="#495566">Dashed: pair history · Arrows: velocity direction</text>
      <rect x="80" y="587" width="600" height="43" rx="10" fill="#ece5f2"/>
      <text x="380" y="616" font-size="23" font-weight="600" fill="#542b73">The model receives only time and location.</text>
    </g>
  </g>
  <g fill="none" stroke-linecap="round" aria-label="Straight conditional histories">
    <path d="M 191.2 467.6 L 367.2 335.6" stroke="#176fa0" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M 568.8 467.6 L 392.8 335.6" stroke="#b84c18" stroke-width="3" stroke-dasharray="8 8"/>
  </g>
  <g fill="none" stroke-linecap="round" aria-label="Conditional and marginal velocity vectors">
    <path d="M 367.2 316.4 L 194 186.5" stroke="#b84c18" stroke-width="4" marker-end="url(#orange-arrow)"/>
    <path d="M 392.8 316.4 L 566 186.5" stroke="#176fa0" stroke-width="4" marker-end="url(#blue-arrow)"/>
    <path d="M 380 310 L 380 176" stroke="#69368e" stroke-width="7" marker-end="url(#mean-arrow)"/>
  </g>
</svg>
