<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">How DoubleMe separates observations from preference evidence</title>
  <desc id="desc">A user prompt reaches the UserPromptSubmit hook, and an assistant response reaches the Stop hook at a turn boundary. Stop produces a temporary record of coarse presentation features, but that record is not evidence by itself. Only a later user correction or explicit approval joins it at an evidence card, which supports a scoped hypothesis.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5f4"/>
    </linearGradient>
    <linearGradient id="evidence" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#276c77"/>
      <stop offset="1" stop-color="#174c55"/>
    </linearGradient>
    <marker id="solid-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1L11 6L0 11Z" fill="#4d747a"/>
    </marker>
    <marker id="feedback-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1L11 6L0 11Z" fill="#2f7a69"/>
    </marker>
    <marker id="soft-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1L11 6L0 11Z" fill="#7c8b92"/>
    </marker>
    <pattern id="contours" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M-7 21C0 13 11 13 18 21S36 29 43 21" fill="none" stroke="#b9d8d5" stroke-width="1.5" opacity=".55"/>
      <path d="M-7 7C0-1 11-1 18 7S36 15 43 7" fill="none" stroke="#b9d8d5" stroke-width="1.5" opacity=".32"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" rx="28" fill="#f7f7f4"/>

  <g id="nodes" font-family="system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
    <rect x="44" y="48" width="1112" height="604" rx="28" fill="url(#surface)" stroke="#9dbdb8" stroke-width="2"/>
    <rect x="45" y="49" width="1110" height="111" rx="28" fill="url(#contours)" opacity=".75"/>
    <text x="80" y="95" fill="#276c77" font-size="18" font-weight="750" letter-spacing="2.2">FROM OBSERVATION TO EVIDENCE</text>
    <text x="80" y="127" fill="#25353b" font-size="27" font-weight="650">An answer’s format is context, not proof that the user liked it.</text>

    <text x="194" y="204" text-anchor="middle" fill="#276c77" font-size="14" font-weight="750" letter-spacing="1.3">1 · TURN STARTS</text>
    <text x="703" y="204" text-anchor="middle" fill="#276c77" font-size="14" font-weight="750" letter-spacing="1.3">2 · TURN BOUNDARY</text>
    <text x="1016" y="204" text-anchor="middle" fill="#2f7a69" font-size="14" font-weight="750" letter-spacing="1.3">3 · LATER FEEDBACK</text>

    <rect x="77" y="242" width="166" height="122" rx="18" fill="#ffffff" stroke="#94b4b0" stroke-width="2"/>
    <circle cx="106" cy="274" r="12" fill="#e4f1f2" stroke="#77aaa5" stroke-width="1.5"/>
    <path d="M100 274h12M106 268v12" fill="none" stroke="#276c77" stroke-width="1.8" stroke-linecap="round"/>
    <text x="94" y="307" fill="#1f2933" font-size="18" font-weight="750">User prompt</text>
    <text x="94" y="334" fill="#5f6f7a" font-size="14">explicit request,</text>
    <text x="94" y="355" fill="#5f6f7a" font-size="14">command, or correction</text>

    <rect x="278" y="242" width="170" height="122" rx="18" fill="#e4f1f2" stroke="#77aaa5" stroke-width="2"/>
    <rect x="294" y="261" width="38" height="27" rx="8" fill="#ffffff" stroke="#77aaa5" stroke-width="1.5"/>
    <path d="M303 270h19M303 278h12" fill="none" stroke="#276c77" stroke-width="1.8" stroke-linecap="round"/>
    <text x="294" y="314" fill="#1f2933" font-size="16" font-weight="750">UserPromptSubmit</text>
    <text x="294" y="339" fill="#3f666c" font-size="14">allow-listed signal</text>
    <text x="294" y="359" fill="#3f666c" font-size="14">or command detected</text>

    <line x1="478" y1="219" x2="478" y2="539" stroke="#94b4b0" stroke-width="2" stroke-dasharray="7 7"/>

    <rect x="520" y="242" width="166" height="122" rx="18" fill="#ffffff" stroke="#94b4b0" stroke-width="2"/>
    <circle cx="549" cy="274" r="12" fill="#f1f4f3" stroke="#94b4b0" stroke-width="1.5"/>
    <path d="M543 274h12M549 268v12" fill="none" stroke="#5f6f7a" stroke-width="1.8" stroke-linecap="round"/>
    <text x="537" y="307" fill="#1f2933" font-size="18" font-weight="750">Assistant response</text>
    <text x="537" y="334" fill="#5f6f7a" font-size="14">the answer that just</text>
    <text x="537" y="355" fill="#5f6f7a" font-size="14">ended the turn</text>

    <rect x="721" y="242" width="164" height="122" rx="18" fill="#eef1f2" stroke="#7c8b92" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="737" y="261" width="38" height="27" rx="8" fill="#ffffff" stroke="#9aa8ae" stroke-width="1.5"/>
    <path d="M746 270h19M746 278h12" fill="none" stroke="#667780" stroke-width="1.8" stroke-linecap="round"/>
    <text x="737" y="314" fill="#33434a" font-size="18" font-weight="750">Stop hook</text>
    <text x="737" y="339" fill="#667780" font-size="14">a turn boundary,</text>
    <text x="737" y="359" fill="#667780" font-size="14">not task completion</text>

    <rect x="721" y="407" width="164" height="127" rx="18" fill="#ffffff" stroke="#7c8b92" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="737" y="439" fill="#33434a" font-size="16" font-weight="750">Temporary features</text>
    <text x="737" y="466" fill="#667780" font-size="14">short · bullets · table</text>
    <text x="737" y="487" fill="#667780" font-size="14">outcome-first</text>
    <rect x="737" y="500" width="130" height="23" rx="11.5" fill="#eef1f2"/>
    <text x="802" y="516" text-anchor="middle" fill="#667780" font-size="12" font-weight="750">NOT EVIDENCE BY ITSELF</text>

    <rect x="921" y="242" width="190" height="122" rx="18" fill="#eff7f3" stroke="#7eb29f" stroke-width="2"/>
    <circle cx="950" cy="274" r="12" fill="#ffffff" stroke="#63a18c" stroke-width="1.5"/>
    <path d="M944 274h12M950 268v12" fill="none" stroke="#2f7a69" stroke-width="1.8" stroke-linecap="round"/>
    <text x="938" y="307" fill="#1f2933" font-size="18" font-weight="750">Later user feedback</text>
    <text x="938" y="334" fill="#3f6b5d" font-size="14">explicit correction</text>
    <text x="938" y="355" fill="#3f6b5d" font-size="14">or explicit approval</text>

    <rect x="921" y="425" width="190" height="109" rx="18" fill="url(#evidence)" stroke="#174c55" stroke-width="2"/>
    <text x="938" y="461" fill="#ffffff" font-size="19" font-weight="750">Evidence</text>
    <text x="938" y="487" fill="#d8f0ee" font-size="13">links feedback with</text>
    <text x="938" y="508" fill="#d8f0ee" font-size="13">safe presentation context</text>

    <rect x="921" y="570" width="190" height="47" rx="16" fill="#e4f1f2" stroke="#77aaa5" stroke-width="2"/>
    <text x="1016" y="600" text-anchor="middle" fill="#276c77" font-size="16" font-weight="750">Scoped hypothesis</text>

    <line x1="77" y1="588" x2="118" y2="588" stroke="#4d747a" stroke-width="3" stroke-linecap="round"/>
    <text x="129" y="593" fill="#5f6f7a" font-size="14">current observation flow</text>
    <line x1="370" y1="588" x2="411" y2="588" stroke="#7c8b92" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
    <text x="422" y="593" fill="#5f6f7a" font-size="14">temporary context only</text>
    <line x1="657" y1="588" x2="698" y2="588" stroke="#2f7a69" stroke-width="3" stroke-linecap="round"/>
    <text x="709" y="593" fill="#5f6f7a" font-size="14">explicit feedback → evidence</text>
  </g>

  <g id="connectors" fill="none" stroke-linecap="round">
    <path d="M243 303H278" stroke="#4d747a" stroke-width="3" marker-end="url(#solid-arrow)"/>
    <path d="M686 303H721" stroke="#7c8b92" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#soft-arrow)"/>
    <path d="M803 364V407" stroke="#7c8b92" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#soft-arrow)"/>
    <path d="M885 470H921" stroke="#7c8b92" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#soft-arrow)"/>
    <path d="M1016 364V425" stroke="#2f7a69" stroke-width="3" marker-end="url(#feedback-arrow)"/>
    <path d="M1016 534V570" stroke="#4d747a" stroke-width="3" marker-end="url(#solid-arrow)"/>
  </g>
</svg>
