<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">DoubleMe's observation and authorization boundary</title>
  <desc id="desc">Explicit requests, corrections, and approvals are reduced to canonical preference signals, then to a scoped hypothesis and a local working profile that the user can control. These steps sit inside the DoubleMe boundary. A separate authorization gate leads by a dashed path to a future consumer, which is not active today.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5f4"/>
    </linearGradient>
    <linearGradient id="profile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#276c77"/>
      <stop offset="1" stop-color="#174c55"/>
    </linearGradient>
    <marker id="solid-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1L11 6L0 11Z" fill="#4d747a"/>
    </marker>
    <marker id="dashed-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1L11 6L0 11Z" fill="#7c8b92"/>
    </marker>
    <pattern id="contours" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M-7 21C0 13 11 13 18 21S36 29 43 21" fill="none" stroke="#b9d8d5" stroke-width="1.5" opacity=".55"/>
      <path d="M-7 7C0-1 11-1 18 7S36 15 43 7" fill="none" stroke="#b9d8d5" stroke-width="1.5" opacity=".32"/>
    </pattern>
  </defs>

  <rect width="1200" height="680" rx="28" fill="#f7f7f4"/>

  <g id="nodes" font-family="system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
    <rect x="44" y="54" width="818" height="574" rx="28" fill="url(#surface)" stroke="#9dbdb8" stroke-width="2"/>
    <rect x="45" y="55" width="816" height="116" rx="28" fill="url(#contours)" opacity=".75"/>
    <text x="76" y="101" fill="#276c77" font-size="18" font-weight="750" letter-spacing="2.2">DOUBLEME TODAY</text>
    <text x="76" y="133" fill="#25353b" font-size="27" font-weight="650">A local, inspectable preference loop</text>
    <rect x="661" y="86" width="169" height="36" rx="18" fill="#e4f1f2" stroke="#8eb8b2"/>
    <text x="745.5" y="109" text-anchor="middle" fill="#276c77" font-size="14" font-weight="750">LOCAL + USER-CONTROLLED</text>

    <rect x="76" y="230" width="163" height="165" rx="18" fill="#ffffff" stroke="#94b4b0" stroke-width="2"/>
    <circle cx="104" cy="263" r="12" fill="#e4f1f2" stroke="#77aaa5" stroke-width="1.5"/>
    <path d="M99 263h10M104 258v10" fill="none" stroke="#276c77" stroke-width="1.8" stroke-linecap="round"/>
    <text x="92" y="298" fill="#1f2933" font-size="18" font-weight="750">Explicit feedback</text>
    <text x="92" y="326" fill="#5f6f7a" font-size="14">request · correction</text>
    <text x="92" y="348" fill="#5f6f7a" font-size="14">or approval</text>

    <rect x="272" y="230" width="163" height="165" rx="18" fill="#ffffff" stroke="#94b4b0" stroke-width="2"/>
    <rect x="288" y="251" width="35" height="27" rx="8" fill="#e4f1f2" stroke="#77aaa5" stroke-width="1.5"/>
    <path d="M297 260h17M297 268h11" fill="none" stroke="#276c77" stroke-width="1.8" stroke-linecap="round"/>
    <text x="288" y="306" fill="#1f2933" font-size="18" font-weight="750">Canonical signals</text>
    <text x="288" y="334" fill="#5f6f7a" font-size="14">concise · code-first</text>
    <text x="288" y="356" fill="#5f6f7a" font-size="14">tests · citations</text>
    <text x="288" y="376" fill="#3f666c" font-size="12.5" font-weight="650">ordinary prompts</text>
    <text x="288" y="390" fill="#3f666c" font-size="12.5" font-weight="650">not retained</text>

    <rect x="468" y="230" width="163" height="165" rx="18" fill="#ffffff" stroke="#94b4b0" stroke-width="2"/>
    <circle cx="496" cy="263" r="12" fill="#f1f4f3" stroke="#94b4b0" stroke-width="1.5"/>
    <path d="M490 263h12M496 257v12" fill="none" stroke="#5f6f7a" stroke-width="1.8" stroke-linecap="round"/>
    <text x="484" y="298" fill="#1f2933" font-size="18" font-weight="750">Scoped hypothesis</text>
    <text x="484" y="329" fill="#5f6f7a" font-size="14">candidate → emerging</text>
    <text x="484" y="351" fill="#5f6f7a" font-size="14">→ established</text>
    <text x="484" y="380" fill="#3f666c" font-size="12.5" font-weight="650">context can change it</text>

    <rect x="664" y="215" width="168" height="195" rx="20" fill="url(#profile)" stroke="#174c55" stroke-width="2"/>
    <rect x="676" y="229" width="144" height="45" rx="12" fill="none" stroke="#bde2df" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="748" y="250" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="750">Local working profile</text>
    <text x="748" y="267" text-anchor="middle" fill="#d8f0ee" font-size="12.5">work preferences only</text>
    <g fill="#e4f1f2" stroke="#9dcac5" stroke-width="1">
      <rect x="678" y="291" width="57" height="27" rx="13.5"/>
      <rect x="761" y="291" width="57" height="27" rx="13.5"/>
      <rect x="678" y="332" width="57" height="27" rx="13.5"/>
      <rect x="761" y="332" width="57" height="27" rx="13.5"/>
      <rect x="720" y="373" width="57" height="25" rx="12.5"/>
    </g>
    <g fill="#174c55" font-size="12.5" font-weight="750" text-anchor="middle">
      <text x="706.5" y="309">show</text>
      <text x="789.5" y="309">correct</text>
      <text x="706.5" y="350">pin</text>
      <text x="789.5" y="350">forget</text>
      <text x="748.5" y="390">pause</text>
    </g>

    <text x="893" y="215" text-anchor="middle" fill="#5f6f7a" font-size="13" font-weight="750">SEPARATE</text>
    <text x="893" y="232" text-anchor="middle" fill="#5f6f7a" font-size="13" font-weight="750">AUTHORIZATION</text>
    <rect x="872" y="266" width="42" height="92" rx="14" fill="#ffffff" stroke="#7c8b92" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="883" y="304" width="20" height="17" rx="3.5" fill="#dfe6e7" stroke="#667780" stroke-width="1.5"/>
    <path d="M887 304v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#667780" stroke-width="2" stroke-linecap="round"/>
    <circle cx="893" cy="313" r="2" fill="#667780"/>

    <text x="1050" y="202" text-anchor="middle" fill="#7c8b92" font-size="14" font-weight="750" letter-spacing="1.4">FUTURE USE</text>
    <rect x="947" y="230" width="205" height="165" rx="18" fill="#ffffff" stroke="#9aa8ae" stroke-width="2" stroke-dasharray="7 6"/>
    <circle cx="978" cy="264" r="12" fill="#eef1f2" stroke="#7c8b92" stroke-width="1.5"/>
    <path d="M972 264h12M978 258v12" fill="none" stroke="#667780" stroke-width="1.8" stroke-linecap="round"/>
    <text x="964" y="299" fill="#33434a" font-size="18" font-weight="750">Authorized consumer</text>
    <text x="964" y="327" fill="#667780" font-size="14">may adapt behavior</text>
    <rect x="964" y="346" width="122" height="25" rx="12.5" fill="#eef1f2"/>
    <text x="1025" y="363" text-anchor="middle" fill="#667780" font-size="12.5" font-weight="750">NOT ACTIVE TODAY</text>

    <text x="76" y="492" fill="#276c77" font-size="15" font-weight="750">WORK PREFERENCES — NOT PERSONALITY OR CAPABILITY</text>
    <text x="76" y="520" fill="#5f6f7a" font-size="15">The profile is narrow, contestable, and removable by the user.</text>
    <line x1="76" y1="565" x2="117" y2="565" stroke="#4d747a" stroke-width="3" stroke-linecap="round"/>
    <text x="128" y="570" fill="#5f6f7a" font-size="14">current learning flow</text>
    <line x1="330" y1="565" x2="371" y2="565" stroke="#7c8b92" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
    <text x="382" y="570" fill="#5f6f7a" font-size="14">future use only, with authorization</text>
  </g>

  <g id="connectors" fill="none" stroke-linecap="round">
    <path d="M239 312H272" stroke="#4d747a" stroke-width="3" marker-end="url(#solid-arrow)"/>
    <path d="M435 312H468" stroke="#4d747a" stroke-width="3" marker-end="url(#solid-arrow)"/>
    <path d="M631 312H664" stroke="#4d747a" stroke-width="3" marker-end="url(#solid-arrow)"/>
    <path d="M832 312H872" stroke="#7c8b92" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#dashed-arrow)"/>
    <path d="M914 312H947" stroke="#7c8b92" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#dashed-arrow)"/>
  </g>
</svg>
