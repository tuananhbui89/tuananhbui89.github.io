<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
<title id="title">Shap-E: generate a 3D function</title><desc id="desc">During representation learning, an encoder maps a known 3D asset to latent vectors. At generation time, conditional diffusion generates vectors in that learned space. Projected vectors supply an implicit neural function that can be rendered as a radiance field or extracted as a textured mesh.</desc>
<defs>
<marker id="dark" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#172b43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#2367a1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="red" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#a33532" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><rect width="840" height="480" fill="#fff"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b43">
<text x="32" y="46" font-size="30" font-weight="700" fill="#172b43" text-anchor="start">Shap-E: generate a 3D function</text>
<text x="40" y="90" font-size="22" font-weight="600" fill="#2367a1" text-anchor="start">1. LEARN THE REPRESENTATION</text>
<rect x="40" y="111" width="320" height="102" rx="14" fill="#f0f5fb" stroke="#bbcddd" stroke-width="2"/>
<rect x="480" y="111" width="320" height="102" rx="14" fill="#f0f5fb" stroke="#bbcddd" stroke-width="2"/>
<text x="200" y="151" font-size="28" font-weight="650" fill="#172b43" text-anchor="middle">Asset encoder</text>
<text x="200" y="189" font-size="23" font-weight="400" fill="#172b43" text-anchor="middle">Point cloud + views</text>
<text x="640" y="151" font-size="27" font-weight="650" fill="#172b43" text-anchor="middle">Training latents z₀</text>
<text x="640" y="189" font-size="21" font-weight="400" fill="#172b43" text-anchor="middle">One code per known asset</text>
<text x="40" y="309" font-size="22" font-weight="600" fill="#2367a1" text-anchor="start">2. GENERATE A NEW ASSET</text>
<rect x="40" y="329" width="320" height="123" rx="14" fill="#f0f5fb" stroke="#bbcddd" stroke-width="2"/>
<rect x="480" y="329" width="320" height="123" rx="14" fill="#eaf6f1" stroke="#80b9ad" stroke-width="2"/>
<text x="200" y="370" font-size="25" font-weight="700" fill="#172b43" text-anchor="middle">Conditional diffusion</text>
<text x="200" y="408" font-size="22" font-weight="400" fill="#172b43" text-anchor="middle">Noise → sampled latent z</text>
<text x="200" y="439" font-size="20" font-weight="400" fill="#172b43" text-anchor="middle">Text or image conditioning</text>
<text x="640" y="370" font-size="26" font-weight="700" fill="#172b43" text-anchor="middle">Implicit 3D function</text>
<text x="640" y="408" font-size="24" font-weight="400" fill="#172b43" text-anchor="middle">NeRF render</text>
<text x="640" y="440" font-size="24" font-weight="400" fill="#172b43" text-anchor="middle">Textured mesh</text>
<path d="M360 163 H480" fill="none" stroke="#172b43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark)"/>
<path d="M640 213 V262 H200 V280 H20 V390 H40" fill="none" stroke="#2367a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="8 7"/>
<text x="420" y="250" font-size="22" font-weight="400" fill="#2367a1" text-anchor="middle">train prior</text>
<path d="M360 390 H480" fill="none" stroke="#172b43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark)"/>
<text x="420" y="366" font-size="22" font-weight="400" fill="#172b43" text-anchor="middle">project</text>
</g></svg>
