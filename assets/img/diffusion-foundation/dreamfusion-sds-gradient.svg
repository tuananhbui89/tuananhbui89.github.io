<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 550" role="img" aria-labelledby="title desc">
<title id="title">DreamFusion: gradient through rendering</title><desc id="desc">A trainable 3D scene produces an image through a differentiable renderer. A frozen image denoiser reads its noisy version and returns a noise residual. The residual is detached and supplied as an image gradient, which flows backward through the renderer to update the scene. No gradient passes through the denoiser.</desc>
<defs>
<marker id="dark" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#172b43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#2367a1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="red" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#a33532" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><rect width="840" height="550" fill="#fff"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b43">
<text x="32" y="46" font-size="29" font-weight="700" fill="#172b43" text-anchor="start">DreamFusion: gradient through rendering</text>
<text x="32" y="82" font-size="22" font-weight="400" fill="#172b43" text-anchor="start">The image model supplies the signal; only the scene is optimized.</text>
<rect x="32" y="155" width="220" height="123" rx="14" fill="#eaf6f1" stroke="#80b9ad" stroke-width="2"/>
<rect x="314" y="155" width="240" height="123" rx="14" fill="#f0f5fb" stroke="#bbcddd" stroke-width="2"/>
<rect x="616" y="155" width="192" height="123" rx="14" fill="#f0f5fb" stroke="#bbcddd" stroke-width="2"/>
<rect x="600" y="360" width="208" height="115" rx="14" fill="#fcf0ef" stroke="#c7827f" stroke-width="2"/>
<text x="142" y="196" font-size="27" font-weight="700" fill="#172b43" text-anchor="middle">3D scene θ</text>
<text x="142" y="234" font-size="25" font-weight="400" fill="#087c73" text-anchor="middle">Trainable</text>
<text x="434" y="195" font-size="25" font-weight="700" fill="#172b43" text-anchor="middle">Render image x</text>
<text x="434" y="234" font-size="24" font-weight="400" fill="#172b43" text-anchor="middle">Differentiable</text>
<text x="712" y="195" font-size="24" font-weight="700" fill="#172b43" text-anchor="middle">2D denoiser</text>
<text x="712" y="234" font-size="24" font-weight="400" fill="#172b43" text-anchor="middle">Frozen</text>
<text x="704" y="394" font-size="23" font-weight="650" fill="#172b43" text-anchor="middle">Noise residual</text>
<text x="704" y="429" font-size="29" font-weight="650" fill="#a33532" text-anchor="middle">ε̂ − ε</text>
<text x="704" y="459" font-size="21" font-weight="700" fill="#a33532" text-anchor="middle">DETACHED</text>
<path d="M252 192 H314" fill="none" stroke="#172b43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark)"/>
<path d="M554 192 H616" fill="none" stroke="#172b43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark)"/>
<text x="582" y="126" font-size="21" font-weight="400" fill="#172b43" text-anchor="middle">+ noise</text>
<path d="M712 278 V360" fill="none" stroke="#172b43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark)"/>
<text x="696" y="318" font-size="20" font-weight="400" fill="#172b43" text-anchor="end">predict</text>
<text x="696" y="343" font-size="20" font-weight="400" fill="#172b43" text-anchor="end">− noise</text>
<path d="M600 416 H434 V278" fill="none" stroke="#a33532" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)" stroke-dasharray="8 7"/>
<text x="340" y="367" font-size="22" font-weight="400" fill="#a33532" text-anchor="end">supply image</text>
<text x="340" y="394" font-size="22" font-weight="400" fill="#a33532" text-anchor="end">gradient</text>
<path d="M314 248 H252" fill="none" stroke="#a33532" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<text x="175" y="323" font-size="22" font-weight="650" fill="#a33532" text-anchor="middle">backpropagate to θ</text>
<text x="32" y="509" font-size="25" font-weight="700" fill="#172b43" text-anchor="start">No gradient through the denoiser.</text>
</g></svg>
