<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
<title id="title">Point-E: grow a colored point set</title><desc id="desc">Point-E first generates a reference image from text, denoises 1,024 colored points conditioned on that image, then denoises 3,072 extra points conditioned on both the image and the initial points. Concatenating the point sets gives 4,096 points.</desc>
<defs>
<marker id="dark" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#172b43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#2367a1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="red" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#a33532" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><rect width="840" height="560" fill="#fff"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b43">
<text x="32" y="46" font-size="30" font-weight="700" fill="#172b43" text-anchor="start">Point-E: grow a colored point set</text>
<rect x="40" y="90" width="320" height="110" rx="14" fill="#f0f5fb" stroke="#bbcddd" stroke-width="2"/>
<rect x="480" y="90" width="320" height="110" rx="14" fill="#f0f5fb" stroke="#bbcddd" stroke-width="2"/>
<rect x="40" y="300" width="320" height="130" rx="14" fill="#f0f5fb" stroke="#bbcddd" stroke-width="2"/>
<rect x="480" y="300" width="320" height="130" rx="14" fill="#eaf6f1" stroke="#80b9ad" stroke-width="2"/>
<rect x="110" y="486" width="620" height="52" rx="14" fill="#172b43" stroke="#172b43" stroke-width="2"/>
<text x="200" y="135" font-size="28" font-weight="650" fill="#172b43" text-anchor="middle">Text prompt</text>
<text x="200" y="173" font-size="24" font-weight="400" fill="#172b43" text-anchor="middle">“a blue chair”</text>
<text x="640" y="134" font-size="28" font-weight="650" fill="#172b43" text-anchor="middle">Synthetic image</text>
<text x="640" y="173" font-size="23" font-weight="400" fill="#172b43" text-anchor="middle">Generated by GLIDE</text>
<text x="200" y="340" font-size="27" font-weight="700" fill="#172b43" text-anchor="middle">Base denoising</text>
<text x="200" y="380" font-size="23" font-weight="400" fill="#172b43" text-anchor="middle">Noise → 1,024 points</text>
<text x="200" y="411" font-size="22" font-weight="400" fill="#2367a1" text-anchor="middle">XYZ + RGB</text>
<text x="640" y="340" font-size="25" font-weight="700" fill="#172b43" text-anchor="middle">Upsampler denoising</text>
<text x="640" y="380" font-size="23" font-weight="400" fill="#172b43" text-anchor="middle">Noise → 3,072 extra</text>
<text x="640" y="411" font-size="22" font-weight="400" fill="#087c73" text-anchor="middle">Keeps the base points</text>
<text x="420" y="520" font-size="25" font-weight="650" fill="#ffffff" text-anchor="middle">1,024 kept + 3,072 new = 4,096 points</text>
<path d="M360 145 H480" fill="none" stroke="#172b43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark)"/>
<path d="M560 200 V242 H200 V300" fill="none" stroke="#2367a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="8 7"/>
<text x="285" y="232" font-size="22" font-weight="400" fill="#2367a1" text-anchor="start">image</text>
<path d="M700 200 V300" fill="none" stroke="#2367a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="8 7"/>
<text x="714" y="261" font-size="22" font-weight="400" fill="#2367a1" text-anchor="start">image</text>
<path d="M360 362 H480" fill="none" stroke="#172b43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark)"/>
<text x="420" y="337" font-size="22" font-weight="600" fill="#172b43" text-anchor="middle">1,024</text>
<text x="420" y="393" font-size="22" font-weight="400" fill="#172b43" text-anchor="middle">points</text>
<path d="M640 430 V486" fill="none" stroke="#172b43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark)"/>
</g></svg>
