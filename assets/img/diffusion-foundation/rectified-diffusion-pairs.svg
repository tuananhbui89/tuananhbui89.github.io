<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Rectified diffusion learns from matched noise and samples</title>
  <desc id="desc">A fixed noise seed epsilon is passed through a frozen deterministic teacher, conditioned on c, to obtain a generated sample x zero. Both endpoints and the condition are stored together. Student training mixes those same endpoints using the existing alpha and sigma schedule, then predicts the saved noise epsilon.</desc>
  <defs>
    <marker id="head" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round"/></marker>
    <marker id="bluehead" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="620" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172033">
    <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="700">Keep the noise that made the sample</text>
    <text x="480" y="81" text-anchor="middle" font-size="18" fill="#475569">Rectified Diffusion · matched endpoints, existing diffusion schedule</text>
    <g id="noise">
      <rect x="55" y="135" width="190" height="92" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
      <text x="150" y="171" text-anchor="middle" font-size="20" font-weight="650">Starting noise</text>
      <text x="150" y="204" text-anchor="middle" font-size="25">ε ∼ N(0, I)</text>
    </g>
    <g id="teacher">
      <rect x="340" y="135" width="270" height="92" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
      <text x="475" y="171" text-anchor="middle" font-size="20" font-weight="650">Frozen teacher Gφ</text>
      <text x="475" y="204" text-anchor="middle" font-size="18" fill="#475569">deterministic · condition c</text>
    </g>
    <g id="sample">
      <rect x="705" y="135" width="200" height="92" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
      <text x="805" y="171" text-anchor="middle" font-size="20" font-weight="650">Generated sample</text>
      <text x="805" y="204" text-anchor="middle" font-size="23">x̃₀ = Gφ(ε, c)</text>
    </g>
    <g id="pair">
      <rect x="225" y="305" width="510" height="95" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
      <text x="480" y="341" text-anchor="middle" font-size="23" font-weight="750" fill="#1e3a8a">Save the matched pair (x̃₀, ε, c)</text>
      <text x="480" y="374" text-anchor="middle" font-size="19" fill="#1e3a8a">The sample stays tied to its original noise.</text>
    </g>
    <g id="training">
      <rect x="135" y="467" width="690" height="112" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
      <text x="480" y="499" text-anchor="middle" font-size="21" font-weight="650">Train the student on the saved endpoints</text>
      <text x="480" y="534" text-anchor="middle" font-size="23">zₜ = αₜ x̃₀ + σₜ ε       →       predict the same ε</text>
      <text x="480" y="561" text-anchor="middle" font-size="17" fill="#475569">αₜ, σₜ and the model prediction type are retained.</text>
    </g>
    <g id="connectors" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
      <path d="M245 181 H340" stroke="#475569" marker-end="url(#head)"/>
      <path d="M610 181 H705" stroke="#475569" marker-end="url(#head)"/>
      <path d="M150 227 V267 H340 V305" stroke="#1d4ed8" stroke-dasharray="7 5" marker-end="url(#bluehead)"/>
      <path d="M805 227 V267 H620 V305" stroke="#1d4ed8" stroke-dasharray="7 5" marker-end="url(#bluehead)"/>
      <path d="M480 400 V467" stroke="#475569" marker-end="url(#head)"/>
    </g>
    <text x="245" y="254" text-anchor="middle" font-size="16" fill="#1e40af">save original ε</text>
    <text x="714" y="254" text-anchor="middle" font-size="16" fill="#1e40af">save its sample</text>
    <text x="500" y="442" font-size="17" fill="#475569">sample a training time t</text>
  </g>
</svg>
