<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">Jev decisions in an agent harness</title>
  <desc id="desc">State and questions enter Jev. Typed answers support model routing, tool checks, and online evaluation, leading to model selection, execution or refusal, and rubric feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d617a"/></marker>
  </defs>
  <rect width="760" height="350" rx="14" fill="#faf8fc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#282132">
    <rect x="260" y="18" width="240" height="46" rx="8" fill="#fff" stroke="#b2a8bd"/>
    <text x="380" y="47" font-size="18">State and questions</text>
    <path d="M380 65 V96" stroke="#6d617a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="260" y="100" width="240" height="58" rx="8" fill="#eadef5" stroke="#9375ab"/>
    <text x="380" y="126" font-size="20" font-weight="bold">Jev</text>
    <text x="380" y="147" font-size="15">Typed answers and probabilities</text>
    <path d="M380 159 V181 H140 V210 M380 181 V210 M380 181 H620 V210" fill="none" stroke="#6d617a" stroke-width="2"/>
    <g stroke="#6d617a" stroke-width="2" marker-end="url(#arrow)"><path d="M140 204 V217"/><path d="M380 204 V217"/><path d="M620 204 V217"/></g>
    <rect x="30" y="221" width="220" height="100" rx="9" fill="#fff" stroke="#b2a8bd"/>
    <rect x="270" y="221" width="220" height="100" rx="9" fill="#fff" stroke="#b2a8bd"/>
    <rect x="510" y="221" width="220" height="100" rx="9" fill="#fff" stroke="#b2a8bd"/>
    <text x="140" y="253" font-size="18" font-weight="bold">Model routing</text>
    <text x="140" y="285" font-size="16">Select a model</text>
    <text x="380" y="253" font-size="18" font-weight="bold">Tool check</text>
    <text x="380" y="285" font-size="16">Run or refuse the call</text>
    <text x="620" y="253" font-size="18" font-weight="bold">Online evaluation</text>
    <text x="620" y="285" font-size="16">Record rubric feedback</text>
  </g>
</svg>
